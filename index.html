<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TheSixClowns OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Escritorio -->
<div class="desktop">
  <div class="icon" onclick="openApp('notepad')">📄 Notas</div>
  <div class="icon" onclick="openApp('browser')">🌐 Internet</div>
</div>

<!-- Barra de tareas -->
<div class="taskbar">
  <button onclick="toggleStart()">☰</button>
  <span>TheSixClowns OS</span>
</div>

<!-- Menú inicio -->
<div id="startMenu" class="start hidden">
  <p onclick="openApp('notepad')">📄 Bloc de notas</p>
  <p onclick="openApp('browser')">🌐 Navegador</p>
</div>

<!-- Ventanas -->
<div id="notepad" class="window hidden">
  <div class="titlebar">
    Bloc de notas
    <button onclick="closeApp('notepad')">X</button>
  </div>
  <textarea placeholder="Escribe aquí..."></textarea>
</div>

<div id="browser" class="window hidden">
  <div class="titlebar">
    Navegador
    <button onclick="closeApp('browser')">X</button>
  </div>
  <iframe src="https://example.com"></iframe>
</div>

<script src="script.js"></script>
</body>
</html>
