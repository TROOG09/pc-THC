
        <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Windows Personalizado</title>
    
    <style>
        /* Pega aquí todo el código CSS que te pasé antes */
        :root {
            --primary-bg: url('https://cdn.discordapp.com/attachments/1474911562828615885/1486504857526337746/Picsart_26-03-24_23-57-43-972.jpg?ex=69c5bf07&is=69c46d87&hm=24bc00bfada867beb0781cffb137d326be57c3c317b0ecc4abcc00c9be02fb27');
        }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
        
        #boot-screen { position: fixed; width: 100%; height: 100%; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; transition: 1s; }
        .logo-boot { width: 150px; border-radius: 20px; margin-bottom: 20px; }
        
        #login-screen { position: fixed; width: 100%; height: 100%; background: var(--primary-bg) center/cover; display: none; align-items: center; justify-content: center; z-index: 900; }
        .login-box { background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); padding: 40px; border-radius: 15px; text-align: center; color: white; }
        
        #desktop { width: 100%; height: 100vh; background: var(--primary-bg) center/cover; display: none; }
        
        #browser-window { position: absolute; top: 5%; left: 5%; width: 90%; height: 85%; background: white; border-radius: 8px; display: none; flex-direction: column; box-shadow: 0 10px 50px rgba(0,0,0,0.5); overflow: hidden; }
        .browser-toolbar { background: #eee; padding: 10px; display: flex; gap: 10px; border-bottom: 1px solid #ccc; }
        .url-bar { flex-grow: 1; padding: 5px 15px; border-radius: 20px; border: 1px solid #ccc; }
        iframe { flex-grow: 1; border: none; }
        
        #taskbar { position: fixed; bottom: 0; width: 100%; height: 40px; background: rgba(0,0,0,0.8); display: flex; align-items: center; padding: 0 10px; }
        .start-btn { width: 30px; height: 30px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="boot-screen">
        <img src="https://cdn.discordapp.com/attachments/1474911562828615885/1486504857526337746/Picsart_26-03-24_23-57-43-972.jpg?ex=69c5bf07&is=69c46d87&hm=24bc00bfada867beb0781cffb137d326be57c3c317b0ecc4abcc00c9be02fb27" class="logo-boot">
        <p>Cargando sistema...</p>
    </div>

    <div id="login-screen">
        <div class="login-box">
            <input type="text" id="username" placeholder="Usuario" style="padding: 10px; margin-bottom: 10px;"><br>
            <button onclick="iniciarSesion()" style="padding: 10px 20px; cursor: pointer;">Entrar</button>
        </div>
    </div>

    <div id="desktop">
        <div onclick="toggleBrowser()" style="width: 100px; color: white; text-align: center; padding: 20px; cursor: pointer;">
            <img src="https://cdn-icons-png.flaticon.com/512/888/888846.png" width="50"><br>Navegador
        </div>

        <div id="browser-window">
            <div class="browser-toolbar">
                <button onclick="toggleBrowser()">✖</button>
                <input type="text" id="url-input" class="url-bar" placeholder="Escribe una URL...">
                <button onclick="irALaWeb()">Ir</button>
            </div>
            <iframe id="browser-frame" sandbox="allow-forms allow-scripts allow-same-origin"></iframe>
        </div>

        <div id="taskbar">
            <img src="https://cdn.discordapp.com/attachments/1474911562828615885/1486504857526337746/Picsart_26-03-24_23-57-43-972.jpg?ex=69c5bf07&is=69c46d87&hm=24bc00bfada867beb0781cffb137d326be57c3c317b0ecc4abcc00c9be02fb27" class="start-btn">
        </div>
    </div>

    <script>
        // Lógica de carga
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('boot-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('boot-screen').style.display = 'none';
                    document.getElementById('login-screen').style.display = 'flex';
                }, 1000);
            }, 3000);
        };

        // Entrar al poner usuario
        function iniciarSesion() {
            const user = document.getElementById('username').value;
            if(user !== "") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('desktop').style.display = 'block';
            }
        }

        // Abrir/Cerrar navegador
        function toggleBrowser() {
            const b = document.getElementById('browser-window');
            b.style.display = (b.style.display === 'flex') ? 'none' : 'flex';
        }

        // Función del Navegador con Proxy
        function irALaWeb() {
            let url = document.getElementById('url-input').value;
            if(!url.startsWith('http')) url = 'https://' + url;
            
            // Usamos el proxy para que las webs no nos rechacen
            const proxy = "https://api.allorigins.win/raw?url=";
            document.getElementById('browser-frame').src = proxy + encodeURIComponent(url);
        }

        // Hacer que funcione el Enter
        document.getElementById('url-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') irALaWeb();
        });
    </script>
</body>
</html>
